# fly.toml — Musikaroid Records Discord Bot
# Bot は HTTP を持たない常駐プロセス。services セクションはなし。
# 常時稼働のため auto_stop/auto_start はデフォルトのまま (常駐)。

app = "musikaroid-discord-bot"
primary_region = "nrt"   # Tokyo — 日本ユーザー向けに近い

[build]
  # Dockerfile を使う (nixpacks より軽量・明示的)

[env]
  NODE_ENV = "production"
  TZ = "Asia/Tokyo"

[[services]]
  # HTTP health server (常駐 keepalive 用) — Fly proxy が auto-stop するのを防ぐ
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
